<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restoran Sipariş Yönetim Paneli</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @keyframes pulse-red {
      0%, 100% { background-color: #fef2f2; }
      50% { background-color: #fee2e2; }
    }
    .pending-card { animation: pulse-red 2s infinite; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <!-- Üst Bar / Header -->
  <header class="bg-slate-900 text-white px-6 py-4 shadow-md flex justify-between items-center sticky top-0 z-20">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 bg-green-500 rounded-full animate-ping"></div>
      <h1 id="panel-title" class="text-xl font-bold tracking-wide">Restoran Sipariş Ekranı</h1>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="enableAudio()" id="audio-btn" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-xs px-3 py-2 rounded-lg transition shadow">
        🔔 Ses Bildirimlerini Etkinleştir
      </button>
      <span class="bg-slate-800 border border-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg">
        Canlı Bağlantı: <span class="text-green-400 font-semibold">Aktif</span>
      </span>
    </div>
  </header>

  <!-- Sipariş Kolonları / Dashboard -->
  <main class="p-6 max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- 1. BEKLEYEN SİPARİŞLER (PENDING) -->
    <section class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-[82vh]">
      <div class="bg-amber-500 text-slate-900 p-4 font-bold flex justify-between items-center">
        <span>Yeni Siparişler</span>
        <span id="pending-count" class="bg-slate-900 text-white text-xs px-2.5 py-1 rounded-full">0</span>
      </div>
      <div id="pending-orders" class="p-4 space-y-4 overflow-y-auto flex-1 bg-gray-50/50">
        <p class="text-center text-gray-400 text-sm py-12">Bekleyen sipariş yok</p>
      </div>
    </section>

    <!-- 2. HAZIRLANAN / YOLDA SİPARİŞLER (PREPARING) -->
    <section class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-[82vh]">
      <div class="bg-blue-600 text-white p-4 font-bold flex justify-between items-center">
        <span>Hazırlanıyor / Yolda</span>
        <span id="preparing-count" class="bg-blue-800 text-white text-xs px-2.5 py-1 rounded-full">0</span>
      </div>
      <div id="preparing-orders" class="p-4 space-y-4 overflow-y-auto flex-1 bg-gray-50/50">
        <p class="text-center text-gray-400 text-sm py-12">Hazırlanan sipariş yok</p>
      </div>
    </section>

    <!-- 3. TAMAMLANAN SİPARİŞLER (COMPLETED) -->
    <section class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-[82vh]">
      <div class="bg-emerald-600 text-white p-4 font-bold flex justify-between items-center">
        <span>Tamamlananlar</span>
        <span id="completed-count" class="bg-emerald-800 text-white text-xs px-2.5 py-1 rounded-full">0</span>
      </div>
      <div id="completed-orders" class="p-4 space-y-4 overflow-y-auto flex-1 bg-gray-50/50">
        <p class="text-center text-gray-400 text-sm py-12">Tamamlanan sipariş yok</p>
      </div>
    </section>

  </main>

  <!-- JavaScript Mantığı -->
  <script>
    // SUPABASE BAGLANTI BILGILERI
    const SUPABASE_URL = "https://cctskakrpyxygxkujefu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjdHNrYWtycHl4eWd4a3VqZWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzQyNTQsImV4cCI6MjEwNjk1MDI1NH0.YkBuSrkPq6ts7UTx5F6DdAdh-ZGMk0rQenDgYzuDyPo";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const RESTAURANT_SLUG = "ornek-pide";

    let currentRestaurantId = null;
    let audioContextAllowed = false;

    // Web Audio API ile Zil Sesi Sentezleme (Ses dosyasına gerek duymaz)
    function playOrderAlert() {
      if (!audioContextAllowed) return;
      
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // İki tonlu uyarı zili (Ding-Dong efekti)
        const playTone = (freq, time, duration) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.3, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(time);
          osc.stop(time + duration);
        };

        const now = audioCtx.currentTime;
        playTone(880, now, 0.4);       // A5 Notası
        playTone(1046.50, now + 0.3, 0.6); // C6 Notası
      } catch (err) {
        console.log("Ses çalınamadı:", err);
      }
    }

    function enableAudio() {
      audioContextAllowed = true;
      const btn = document.getElementById("audio-btn");
      btn.className = "bg-green-500 text-white font-bold text-xs px-3 py-2 rounded-lg transition shadow";
      btn.innerText = "🔊 Sesli Bildirimler Aktif";
      playOrderAlert(); // Test sesi
    }

    window.addEventListener("DOMContentLoaded", async () => {
      // 1. Restoran ID'sini Çek
      const { data: restaurant } = await supabaseClient
        .from("restaurants")
        .select("id, name")
        .eq("slug", RESTAURANT_SLUG)
        .single();

      if (restaurant) {
        currentRestaurantId = restaurant.id;
        document.getElementById("panel-title").innerText = `${restaurant.name} - Sipariş Yönetim Paneli`;
        
        await loadOrders();
        listenToNewOrders();
      }
    });

    // Varolan Siparişleri Yükle
    async function loadOrders() {
      const { data: orders, error } = await supabaseClient
        .from("orders")
        .select("*")
        .eq("restaurant_id", currentRestaurantId)
        .order("created_at", { ascending: false });

      if (error) return;

      renderOrders(orders);
    }

    // Ekranı Güncelle
    function renderOrders(orders) {
      const pendingContainer = document.getElementById("pending-orders");
      const preparingContainer = document.getElementById("preparing-orders");
      const completedContainer = document.getElementById("completed-orders");

      pendingContainer.innerHTML = "";
      preparingContainer.innerHTML = "";
      completedContainer.innerHTML = "";

      let counts = { pending: 0, preparing: 0, completed: 0 };

      orders.forEach(order => {
        const card = createOrderCard(order);
        if (order.status === "pending") {
          pendingContainer.appendChild(card);
          counts.pending++;
        } else if (order.status === "preparing") {
          preparingContainer.appendChild(card);
          counts.preparing++;
        } else if (order.status === "completed") {
          completedContainer.appendChild(card);
          counts.completed++;
        }
      });

      document.getElementById("pending-count").innerText = counts.pending;
      document.getElementById("preparing-count").innerText = counts.preparing;
      document.getElementById("completed-count").innerText = counts.completed;

      if (counts.pending === 0) pendingContainer.innerHTML = '<p class="text-center text-gray-400 text-sm py-12">Bekleyen sipariş yok</p>';
      if (counts.preparing === 0) preparingContainer.innerHTML = '<p class="text-center text-gray-400 text-sm py-12">Hazırlanan sipariş yok</p>';
      if (counts.completed === 0) completedContainer.innerHTML = '<p class="text-center text-gray-400 text-sm py-12">Tamamlanan sipariş yok</p>';
    }

    // Sipariş Kartı Oluşturma
    function createOrderCard(order) {
      const div = document.createElement("div");
      const isPending = order.status === "pending";
      div.className = `bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3 ${isPending ? 'pending-card border-red-300' : ''}`;

      const itemsList = order.items.map(i => `<li class="flex justify-between text-xs text-gray-700"><span><b>${i.qty}x</b> ${i.name}</span> <span>${(i.price * i.qty).toFixed(2)} TL</span></li>`).join('');

      let actionButtons = '';
      if (order.status === 'pending') {
        actionButtons = `
          <button onclick="updateStatus('${order.id}', 'preparing')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-xs transition">
            Onayla & Hazırla ➔
          </button>
        `;
      } else if (order.status === 'preparing') {
        actionButtons = `
          <button onclick="updateStatus('${order.id}', 'completed')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-xs transition">
            Teslim Edildi / Tamamla ✓
          </button>
        `;
      }

      div.innerHTML = `
        <div class="flex justify-between items-start border-b pb-2">
          <div>
            <h4 class="font-bold text-gray-900 text-sm">${order.customer_name}</h4>
            <p class="text-xs text-gray-500">${order.customer_phone}</p>
          </div>
          <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded font-mono">${new Date(order.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
        </div>

        <div class="bg-gray-50 p-2.5 rounded-lg text-xs space-y-1">
          <p class="text-gray-500 font-semibold">Teslimat / Masa:</p>
          <p class="text-gray-800 font-medium">${order.table_number}</p>
          ${order.customer_note ? `<p class="text-amber-700 italic border-t pt-1 mt-1">Not: ${order.customer_note}</p>` : ''}
        </div>

        <ul class="space-y-1 divide-y divide-gray-100 border-t border-b py-2">
          ${itemsList}
        </ul>

        <div class="flex justify-between items-center font-bold text-sm text-gray-900">
          <span>Toplam:</span>
          <span class="text-green-700 text-base">${order.total_amount.toFixed(2)} TL</span>
        </div>

        ${actionButtons}
      `;

      return div;
    }

    // Durum Güncelle
    async function updateStatus(orderId, newStatus) {
      await supabaseClient
        .from("orders")
        .update({ status: newStatus })
        .eq("id", orderId);

      await loadOrders();
    }

    // Canlı Takip (Realtime Listener)
    function listenToNewOrders() {
      supabaseClient
        .channel('public:orders')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
          loadOrders();
          if (payload.eventType === 'INSERT') {
            playOrderAlert();
          }
        })
        .subscribe();
    }
  </script>
</body>
</html>
