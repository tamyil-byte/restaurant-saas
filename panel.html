<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restoran Operasyon Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen p-4 md:p-6">

  <div class="max-w-[1600px] mx-auto space-y-6">
    <!-- Üst Bilgi Barı -->
    <header class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-lg font-extrabold text-slate-900">Restoran Canlı Operasyon Paneli</h1>
        <p class="text-xs text-slate-500 mt-0.5">Sipariş mutfak süreci, kurye atama ve canlı teslimat takibi.</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs font-bold bg-emerald-50 text-emerald-700 px-3 py-2 rounded-xl border border-emerald-200">
          Günlük Ciro: <span id="daily-total" class="text-sm font-extrabold">0.00 TL</span>
        </span>
        <button onclick="loadOrders()" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition">
          🔄 Yenile
        </button>
      </div>
    </header>

    <!-- 4 Sütunlu Operasyon Akışı -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      
      <!-- 1. Kolon: Hazırlananlar (Mutfak) -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-amber-200 space-y-3">
        <div class="flex justify-between items-center border-b border-amber-100 pb-2.5">
          <h2 class="font-bold text-amber-800 text-xs uppercase tracking-wide flex items-center gap-1.5">
            <span class="w-2 h-2 bg-amber-500 rounded-full animate-pulse"></span> Hazırlananlar
          </h2>
          <span id="preparing-count" class="bg-amber-100 text-amber-800 text-xs font-extrabold px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="preparing-list" class="space-y-2.5 min-h-[350px]">
          <p class="text-center text-slate-400 text-xs py-12">Hazırlanan sipariş yok.</p>
        </div>
      </div>

      <!-- 2. Kolon: Kurye Bekleyenler (Tezgahta Hazır) -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-purple-200 space-y-3">
        <div class="flex justify-between items-center border-b border-purple-100 pb-2.5">
          <h2 class="font-bold text-purple-800 text-xs uppercase tracking-wide flex items-center gap-1.5">
            <span class="w-2 h-2 bg-purple-500 rounded-full"></span> Kurye Bekleyenler
          </h2>
          <span id="waiting-count" class="bg-purple-100 text-purple-800 text-xs font-extrabold px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="waiting-list" class="space-y-2.5 min-h-[350px]">
          <p class="text-center text-slate-400 text-xs py-12">Bekleyen paket yok.</p>
        </div>
      </div>

      <!-- 3. Kolon: Yolda Olanlar (Kuryede / Canlı GPS) -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-blue-200 space-y-3">
        <div class="flex justify-between items-center border-b border-blue-100 pb-2.5">
          <h2 class="font-bold text-blue-800 text-xs uppercase tracking-wide flex items-center gap-1.5">
            <span class="w-2 h-2 bg-blue-500 rounded-full animate-ping"></span> Yolda Olanlar
          </h2>
          <span id="delivering-count" class="bg-blue-100 text-blue-800 text-xs font-extrabold px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="delivering-list" class="space-y-2.5 min-h-[350px]">
          <p class="text-center text-slate-400 text-xs py-12">Yolda kurye yok.</p>
        </div>
      </div>

      <!-- 4. Kolon: Tamamlananlar (Bugün) -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-200 space-y-3">
        <div class="flex justify-between items-center border-b border-emerald-100 pb-2.5">
          <h2 class="font-bold text-emerald-800 text-xs uppercase tracking-wide flex items-center gap-1.5">
            <span class="w-2 h-2 bg-emerald-500 rounded-full"></span> Tamamlananlar
          </h2>
          <span id="completed-count" class="bg-emerald-100 text-emerald-800 text-xs font-extrabold px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="completed-list" class="space-y-2.5 min-h-[350px]">
          <p class="text-center text-slate-400 text-xs py-12">Teslim edilen yok.</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cctskakrpyxygxkujefu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjdHNrYWtycHl4eWd4a3VqZWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzQyNTQsImV4cCI6MjEwNjk1MDI1NH0.YkBuSrkPq6ts7UTx5F6DdAdh-ZGMk0rQenDgYzuDyPo";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.addEventListener("DOMContentLoaded", () => {
      loadOrders();
      supabaseClient
        .channel('admin-dashboard-4col')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
          loadOrders();
        })
        .subscribe();
    });

    async function loadOrders() {
      const { data: orders, error } = await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(40);

      if (error) return;
      renderDashboard(orders);
    }

    function renderDashboard(orders) {
      const prepList = document.getElementById("preparing-list");
      const waitList = document.getElementById("waiting-list");
      const delivList = document.getElementById("delivering-list");
      const compList = document.getElementById("completed-list");
      
      prepList.innerHTML = "";
      waitList.innerHTML = "";
      delivList.innerHTML = "";
      compList.innerHTML = "";

      const preparingOrders = orders.filter(o => o.status === 'preparing');
      const waitingOrders = orders.filter(o => o.status === 'waiting_for_courier');
      const deliveringOrders = orders.filter(o => o.status === 'delivering');
      const completedOrders = orders.filter(o => o.status === 'completed');

      document.getElementById("preparing-count").innerText = preparingOrders.length;
      document.getElementById("waiting-count").innerText = waitingOrders.length;
      document.getElementById("delivering-count").innerText = deliveringOrders.length;
      document.getElementById("completed-count").innerText = completedOrders.length;

      const totalRevenue = completedOrders.reduce((sum, item) => sum + (item.total_amount || 0), 0);
      document.getElementById("daily-total").innerText = totalRevenue.toFixed(2) + " TL";

      // 1. Hazırlananlar
      if (preparingOrders.length === 0) {
        prepList.innerHTML = '<p class="text-center text-slate-400 text-xs py-12">Hazırlanan sipariş yok.</p>';
      } else {
        preparingOrders.forEach(order => prepList.appendChild(createCard(order, 'amber')));
      }

      // 2. Kurye Bekleyenler
      if (waitingOrders.length === 0) {
        waitList.innerHTML = '<p class="text-center text-slate-400 text-xs py-12">Kurye bekleyen paket yok.</p>';
      } else {
        waitingOrders.forEach(order => waitList.appendChild(createCard(order, 'purple')));
      }

      // 3. Yolda Olanlar
      if (deliveringOrders.length === 0) {
        delivList.innerHTML = '<p class="text-center text-slate-400 text-xs py-12">Yolda kurye yok.</p>';
      } else {
        deliveringOrders.forEach(order => delivList.appendChild(createCard(order, 'blue')));
      }

      // 4. Tamamlananlar
      if (completedOrders.length === 0) {
        compList.innerHTML = '<p class="text-center text-slate-400 text-xs py-12">Teslim edilen yok.</p>';
      } else {
        completedOrders.forEach(order => compList.appendChild(createCard(order, 'emerald')));
      }
    }

    function createCard(order, theme) {
      const borderColors = { 
        amber: 'border-amber-200 bg-amber-50/40', 
        purple: 'border-purple-200 bg-purple-50/40',
        blue: 'border-blue-200 bg-blue-50/40', 
        emerald: 'border-emerald-200 bg-emerald-50/40' 
      };
      
      let itemsListHtml = '';
      if (order.items && Array.isArray(order.items)) {
        itemsListHtml = order.items.map(i => `<li class="flex justify-between font-medium text-slate-700"><span>${i.name}</span> <span class="font-bold">x${i.qty}</span></li>`).join('');
      }

      const card = document.createElement("div");
      card.className = `p-3.5 rounded-xl border ${borderColors[theme]} space-y-2 text-xs shadow-sm bg-white`;
      card.innerHTML = `
        <div class="flex justify-between items-start">
          <div>
            <span class="font-extrabold text-slate-900 text-sm block">${order.customer_name}</span>
            <span class="text-[10px] text-slate-400">${order.customer_phone || ''}</span>
          </div>
          <span class="font-black text-slate-900 text-xs bg-slate-100 px-2 py-1 rounded-lg">${(order.total_amount || 0).toFixed(2)} TL</span>
        </div>

        <div class="bg-slate-50 p-2 rounded-lg border border-slate-100 space-y-1">
          <p class="text-[10px] font-bold text-slate-400 uppercase">Sipariş İçeriği:</p>
          <ul class="text-[11px] space-y-0.5">
            ${itemsListHtml || '<li class="text-slate-400">Ürün detayı yok</li>'}
          </ul>
        </div>

        ${order.notes ? `
          <div class="bg-amber-100/60 p-2 rounded-lg border border-amber-200 text-amber-900 text-[11px]">
            <span class="font-bold">📝 Not:</span> ${order.notes}
          </div>
        ` : ''}

        <p class="text-slate-500 text-[11px] truncate">📍 ${order.table_number}</p>

        <div class="pt-2 border-t border-slate-100 flex justify-between items-center">
          <span class="text-[10px] text-slate-400">${new Date(order.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
          
          ${theme === 'amber' ? `
            <button onclick="markAsReady('${order.id}')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold px-3 py-1.5 rounded-lg transition text-[11px]">
              🔔 Mutfak Bitti / Kurye Çağır
            </button>
          ` : ''}

          ${theme === 'purple' ? '<span class="text-purple-700 font-bold">⏳ Kurye Bekliyor</span>' : ''}
          ${theme === 'blue' ? '<span class="text-blue-600 font-bold animate-pulse">🛵 Kurye Yolda</span>' : ''}
          ${theme === 'emerald' ? '<span class="text-emerald-700 font-bold">✓ Teslim Edildi</span>' : ''}
        </div>
      `;
      return card;
    }

    async function markAsReady(orderId) {
      const { error } = await supabaseClient
        .from("orders")
        .update({ status: 'waiting_for_courier' })
        .eq("id", orderId);

      if (error) {
        alert("Durum güncellenemedi: " + error.message);
        return;
      }
      loadOrders();
    }
  </script>
</body>
</html>
