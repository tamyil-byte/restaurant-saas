<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Google Sipariş Menüsü</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans pb-24">

  <!-- Üst Bilgi / Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10 px-4 py-3 shadow-sm">
    <div class="flex items-center justify-between">
      <div>
        <h1 id="restaurant-name" class="text-lg font-bold text-gray-900">Yükleniyor...</h1>
        <p class="text-xs text-green-600 font-medium flex items-center gap-1">
          <span class="w-2 h-2 bg-green-500 rounded-full inline-block"></span> Google Haritalar Sipariş Hattı
        </p>
      </div>
      <span class="bg-blue-50 text-blue-700 text-xs px-2.5 py-1 rounded-full font-semibold border border-blue-100">
        Google Doğrulanmış
      </span>
    </div>
  </header>

  <!-- Menü Listesi -->
  <main class="max-w-md mx-auto p-4">
    <div id="menu-container" class="space-y-4">
      <!-- Ürünler JavaScript ile buraya yüklenecek -->
      <div class="text-center py-8 text-gray-400 text-sm">Menü yükleniyor...</div>
    </div>
  </main>

  <!-- Alt Sepet Barları / Checkout Bar -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-lg hidden z-20">
    <div class="max-w-md mx-auto flex items-center justify-between gap-4">
      <div>
        <p class="text-xs text-gray-500">Toplam Tutar</p>
        <p id="cart-total" class="text-lg font-extrabold text-gray-900">0.00 TL</p>
      </div>
      <button onclick="openCheckoutModal()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition flex-1 text-center">
        Siparişi Tamamla (<span id="cart-count">0</span>)
      </button>
    </div>
  </div>

  <!-- Müşteri Bilgi & Onay Modalı -->
  <div id="checkout-modal" class="fixed inset-0 bg-black/60 z-30 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h2 class="text-lg font-bold text-gray-900">Sipariş & Teslimat Bilgileri</h2>
        <button onclick="closeCheckoutModal()" class="text-gray-400 text-xl font-bold">&times;</button>
      </div>

      <form id="order-form" onsubmit="submitOrder(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Ad Soyad</label>
          <input type="text" id="cust-name" required placeholder="Ahmet Yılmaz" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-green-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Telefon Numarası</label>
          <input type="tel" id="cust-phone" required placeholder="0532XXXXXXX" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-green-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Teslimat Adresi / Masa No</label>
          <textarea id="cust-address" required rows="2" placeholder="Sokak, Bina No, Daire veya Masa No" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-green-500 outline-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Sipariş Notu (Opsiyonel)</label>
          <input type="text" id="cust-note" placeholder="Örn: Zil çalmayın, acısız olsun" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-green-500 outline-none">
        </div>

        <div class="pt-2 border-t mt-4">
          <button type="submit" id="submit-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
            Siparişi Gönder (Kapıda Ödeme)
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Mantığı -->
  <script>
    // SUPABASE BAGLANTI BILGILERI (Kendi Supabase paneli bilgilerinizle değiştirin)
    const SUPABASE_URL = "https://cctskakrpyxygxkujefu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjdHNrYWtycHl4eWd4a3VqZWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzQyNTQsImV4cCI6MjEwNjk1MDI1NH0.YkBuSrkPq6ts7UTx5F6DdAdh-ZGMk0rQenDgYzuDyPo";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Test Restoran Slug'ı (Veritabanındaki slug ile aynı olmalı)
    const RESTAURANT_SLUG = "ornek-pide";

    let currentRestaurant = null;
    let cart = [];

    // Sayfa Yüklendiğinde Verileri Çek
    window.addEventListener("DOMContentLoaded", async () => {
      await loadRestaurantData();
    });

    async function loadRestaurantData() {
      // 1. Restoran Bilgisini Çek
      const { data: restaurant, error: rErr } = await supabaseClient
        .from("restaurants")
        .select("*")
        .eq("slug", RESTAURANT_SLUG)
        .single();

      if (rErr || !restaurant) {
        document.getElementById("restaurant-name").innerText = "Restoran Bulunamadı";
        return;
      }

      currentRestaurant = restaurant;
      document.getElementById("restaurant-name").innerText = restaurant.name;

      // 2. Menü Ürünlerini Çek
      const { data: items, error: mErr } = await supabaseClient
        .from("menu_items")
        .select("*")
        .eq("restaurant_id", restaurant.id)
        .eq("is_available", true);

      if (mErr) return;

      renderMenu(items);
    }

    function renderMenu(items) {
      const container = document.getElementById("menu-container");
      container.innerHTML = "";

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center";
        card.innerHTML = `
          <div class="pr-4">
            <h3 class="font-bold text-gray-900 text-sm">${item.name}</h3>
            <p class="text-xs text-gray-500 mt-0.5">${item.description || ''}</p>
            <p class="text-sm font-extrabold text-green-700 mt-2">${item.price.toFixed(2)} TL</p>
          </div>
          <button onclick="addToCart('${item.id}', '${item.name}', ${item.price})" class="bg-green-50 hover:bg-green-100 text-green-700 font-bold px-3.5 py-2 rounded-lg border border-green-200 text-xs transition">
            + Ekle
          </button>
        `;
        container.appendChild(card);
      });
    }

    function addToCart(id, name, price) {
      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id, name, price, qty: 1 });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const cartBar = document.getElementById("cart-bar");
      if (cart.length === 0) {
        cartBar.classList.add("hidden");
        return;
      }

      cartBar.classList.remove("hidden");
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      document.getElementById("cart-count").innerText = totalCount;
      document.getElementById("cart-total").innerText = totalPrice.toFixed(2) + " TL";
    }

    function openCheckoutModal() {
      document.getElementById("checkout-modal").classList.remove("hidden");
    }

    function closeCheckoutModal() {
      document.getElementById("checkout-modal").classList.add("hidden");
    }

    async function submitOrder(e) {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.innerText = "Sipariş İletiliyor...";

      const customerName = document.getElementById("cust-name").value;
      const customerPhone = document.getElementById("cust-phone").value;
      const customerAddress = document.getElementById("cust-address").value;
      const customerNote = document.getElementById("cust-note").value;

      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const orderPayload = {
        restaurant_id: currentRestaurant.id,
        order_source: 'google_maps',
        table_number: customerAddress,
        customer_name: customerName,
        customer_phone: customerPhone,
        customer_note: customerNote,
        items: cart,
        total_amount: totalPrice,
        status: 'pending'
      };

      const { data, error } = await supabaseClient
        .from("orders")
        .insert([orderPayload]);

      if (error) {
        alert("Sipariş iletilirken bir hata oluştu: " + error.message);
        btn.disabled = false;
        btn.innerText = "Siparişi Gönder (Kapıda Ödeme)";
      } else {
        alert("Siparişiniz başarıyla alındı! Restoran en kısa sürede hazırlayacaktır.");
        cart = [];
        updateCartUI();
        closeCheckoutModal();
        btn.disabled = false;
        btn.innerText = "Siparişi Gönder (Kapıda Ödeme)";
      }
    }
  </script>
</body>
</html>
