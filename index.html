<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Restoran Menü & Sipariş</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen pb-24">

  <!-- Üst Bar -->
  <header class="bg-white p-4 shadow-sm border-b sticky top-0 z-10 flex justify-between items-center">
    <div>
      <h1 class="font-bold text-slate-900 text-base">Lezzet Durağı</h1>
      <p class="text-xs text-slate-500">Online Sipariş Sistemi</p>
    </div>
    <button onclick="toggleCartModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs px-3.5 py-2 rounded-xl shadow-sm flex items-center gap-1.5 transition">
      🛒 Sepetim (<span id="cart-count">0</span>) - <span id="cart-total-badge">0.00 TL</span>
    </button>
  </header>

  <!-- Ana İçerik: Menü Listesi -->
  <main class="max-w-xl mx-auto p-4 space-y-4">
    <div class="flex justify-between items-center">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Menü Ürünleri</h2>
    </div>
    <div id="menu-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <p class="text-center text-slate-400 text-xs py-10 col-span-2">Menü yükleniyor...</p>
    </div>
  </main>

  <!-- Sepet & Sipariş Onay Modal (Gizli / Açılır) -->
  <div id="cart-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl shadow-xl max-h-[90vh] overflow-y-auto p-6 space-y-5">
      
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-extrabold text-slate-900 text-base">Sepetiniz ve Sipariş Bilgileri</h3>
        <button onclick="toggleCartModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
      </div>

      <!-- Sepetteki Ürünler Listesi -->
      <div id="modal-cart-items" class="space-y-2.5 max-h-48 overflow-y-auto pr-1">
        <!-- Dinamik dolacak -->
      </div>

      <div class="border-t pt-3 flex justify-between items-center font-extrabold text-slate-900 text-sm">
        <span>Toplam Tutar:</span>
        <span id="modal-total" class="text-amber-600 text-base">0.00 TL</span>
      </div>

      <!-- Müşteri Bilgileri ve Not Formu -->
      <form onsubmit="createOrder(event)" class="space-y-3 pt-2 border-t">
        <div>
          <label class="text-[11px] font-bold text-slate-600">Ad Soyad</label>
          <input type="text" id="cust-name" placeholder="Örn: Ahmet Yılmaz" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 focus:outline-none focus:border-amber-500" required>
        </div>

        <div>
          <label class="text-[11px] font-bold text-slate-600">Telefon</label>
          <input type="tel" id="cust-phone" placeholder="0532..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 focus:outline-none focus:border-amber-500" required>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-bold text-slate-600">Teslimat Adresi</label>
            <button type="button" onclick="autoDetectLocation()" class="text-[10px] text-blue-600 font-bold bg-blue-50 px-2 py-0.5 rounded border border-blue-200">
              📍 Konumumu Al
            </button>
          </div>
          <textarea id="cust-address" rows="2" placeholder="Adres veya konum tarifi..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 focus:outline-none focus:border-amber-500" required></textarea>
        </div>

        <div>
          <label class="text-[11px] font-bold text-slate-600">Sipariş Notu (Opsiyonel)</label>
          <input type="text" id="cust-note" placeholder="Örn: Zil çalmasın, bebek uyuyor." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 focus:outline-none focus:border-amber-500">
        </div>

        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3.5 rounded-xl shadow transition text-xs mt-3">
          Siparişi Tamamla ve Canlı Takibe Geç 🚀
        </button>
      </form>

    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cctskakrpyxygxkujefu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjdHNrYWtycHl4eWd4a3VqZWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzQyNTQsImV4cCI6MjEwNjk1MDI1NH0.YkBuSrkPq6ts7UTx5F6DdAdh-ZGMk0rQenDgYzuDyPo";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let defaultRestaurantId = null;
    let cart = [];

    window.addEventListener("DOMContentLoaded", async () => {
      const { data: restData } = await supabaseClient.from("restaurants").select("id").limit(1);
      if (restData && restData.length > 0) {
        defaultRestaurantId = restData[0].id;
        loadMenu(defaultRestaurantId);
      }
    });

    async function loadMenu(restaurantId) {
      const { data: menuItems, error } = await supabaseClient
        .from("menu_items")
        .select("*")
        .eq("restaurant_id", restaurantId);

      const container = document.getElementById("menu-list");
      container.innerHTML = "";

      if (error || !menuItems || menuItems.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-400 text-xs py-10 col-span-2">Menüde ürün bulunamadı.</p>';
        return;
      }

      menuItems.forEach(item => {
        const div = document.createElement("div");
        div.className = "bg-white p-4 rounded-2xl border border-slate-200 flex justify-between items-center shadow-sm";
        div.innerHTML = `
          <div>
            <h3 class="font-bold text-slate-800 text-xs">${item.name}</h3>
            <p class="text-slate-500 text-[11px] mt-1 font-semibold">${item.price.toFixed(2)} TL</p>
          </div>
          <button onclick="addToCart('${item.id}', '${item.name}', ${item.price})" class="bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition">
            + Sepete Ekle
          </button>
        `;
        container.appendChild(div);
      });
    }

    function addToCart(id, name, price) {
      const existing = cart.find(i => i.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id, name, price, qty: 1 });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const totalCount = cart.reduce((sum, i) => sum + i.qty, 0);
      const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      
      document.getElementById("cart-count").innerText = totalCount;
      document.getElementById("cart-total-badge").innerText = totalPrice.toFixed(2) + " TL";
      document.getElementById("modal-total").innerText = totalPrice.toFixed(2) + " TL";

      const modalItemsContainer = document.getElementById("modal-cart-items");
      modalItemsContainer.innerHTML = "";

      if (cart.length === 0) {
        modalItemsContainer.innerHTML = '<p class="text-center text-slate-400 text-xs py-4">Sepetiniz boş.</p>';
        return;
      }

      cart.forEach(item => {
        const row = document.createElement("div");
        row.className = "flex justify-between items-center bg-slate-50 p-2.5 rounded-xl text-xs";
        row.innerHTML = `
          <div>
            <span class="font-bold text-slate-800">${item.name}</span>
            <span class="text-slate-500 ml-1">(${item.qty} adet)</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-slate-700">${(item.price * item.qty).toFixed(2)} TL</span>
            <button onclick="removeFromCart('${item.id}')" class="text-red-500 font-bold px-1.5 py-0.5 rounded hover:bg-red-50">Sil</button>
          </div>
        `;
        modalItemsContainer.appendChild(row);
      });
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      updateCartUI();
    }

    function toggleCartModal() {
      if (cart.length === 0) {
        alert("Sepetiniz boş! Lütfen önce ürün ekleyin.");
        return;
      }
      const modal = document.getElementById("cart-modal");
      modal.classList.toggle("hidden");
    }

    async function autoDetectLocation() {
      if (!navigator.geolocation) return alert("Konum desteklenmiyor.");
      const btn = event.target;
      btn.innerText = "Alınıyor...";

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude: lat, longitude: lng } = pos.coords;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
            headers: { 'Accept-Language': 'tr' }
          });
          const data = await res.json();
          document.getElementById("cust-address").value = data.display_name || `Enlem: ${lat}, Boylam: ${lng}`;
          btn.innerText = "✓ Eklendi";
        } catch {
          document.getElementById("cust-address").value = `Konum: ${lat}, ${lng}`;
          btn.innerText = "✓ Alındı";
        }
      }, () => {
        alert("Konum alınamadı.");
        btn.innerText = "📍 Konumumu Al";
      }, { enableHighAccuracy: true });
    }

    async function createOrder(event) {
      event.preventDefault();

      if (cart.length === 0) {
        alert("Sepetiniz boş.");
        return;
      }

      const name = document.getElementById("cust-name-val") || document.getElementById("cust-name").value;
      const phone = document.getElementById("cust-phone").value;
      const address = document.getElementById("cust-address").value;
      const note = document.getElementById("cust-note").value;
      const totalAmount = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

      const { data, error } = await supabaseClient
        .from("orders")
        .insert([
          {
            restaurant_id: defaultRestaurantId,
            customer_name: document.getElementById("cust-name").value,
            customer_phone: phone,
            table_number: address,
            notes: note, // Sipariş notu alanı
            total_amount: totalAmount,
            items: cart,
            status: 'preparing'
          }
        ])
        .select();

      if (error) {
        alert("Sipariş oluşturulamadı: " + error.message);
        return;
      }

      if (data && data.length > 0) {
        window.location.href = `takip.html?id=${data[0].id}`;
      }
    }
  </script>
</body>
</html>
