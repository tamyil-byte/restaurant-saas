<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sipariş Canlı Takip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>#map { height: 60vh; width: 100%; }</style>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-10">

  <header class="bg-white p-4 shadow-sm border-b flex justify-between items-center">
    <div>
      <h1 class="font-bold text-gray-900 text-base">Sipariş Canlı Takip</h1>
      <p id="order-status-text" class="text-xs text-amber-600 font-semibold flex items-center gap-1 mt-0.5">
        <span class="w-2 h-2 bg-amber-500 rounded-full animate-ping"></span> Kurye Yola Çıkması Bekleniyor
      </p>
    </div>
    <span class="bg-green-50 text-green-700 text-xs px-2.5 py-1 rounded-full border border-green-200 font-medium">Canlı</span>
  </header>

  <div class="relative">
    <div id="map"></div>
    <div id="no-location-overlay" class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-6 text-center text-white z-[1000]">
      <div>
        <div class="text-3xl mb-2">🛵</div>
        <h3 class="font-bold text-base">Kurye Yolda</h3>
        <p class="text-xs text-slate-300 mt-1">Kurye GPS konumunu paylaştığında haritada görünecektir.</p>
      </div>
    </div>
  </div>

  <main class="max-w-md mx-auto p-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <span class="text-xs text-gray-500 font-medium">Müşteri</span>
        <span id="cust-name" class="text-xs font-bold text-gray-900">-</span>
      </div>
      <div class="flex justify-between items-center border-b pb-2">
        <span class="text-xs text-gray-500 font-medium">Teslimat Adresi</span>
        <span id="cust-address" class="text-xs font-bold text-gray-900 text-right truncate max-w-[200px]">-</span>
      </div>
      <div class="flex justify-between items-center pt-1">
        <span class="text-xs text-gray-500 font-medium">Toplam Tutar</span>
        <span id="cust-total" class="text-sm font-extrabold text-green-700">-</span>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://cctskakrpyxygxkujefu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjdHNrYWtycHl4eWd4a3VqZWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzQyNTQsImV4cCI6MjEwNjk1MDI1NH0.YkBuSrkPq6ts7UTx5F6DdAdh-ZGMk0rQenDgYzuDyPo";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let map = null;
    let courierMarker = null;

    window.addEventListener("DOMContentLoaded", () => {
      map = L.map('map').setView([41.0082, 28.9784], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      loadAndTrackLatestOrder();
    });

    async function loadAndTrackLatestOrder() {
      const { data: orders, error } = await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(1);

      if (error || !orders.length) return;

      const order = orders[0];
      updateUI(order);

      // Realtime kanal aboneliği
      supabaseClient
        .channel(`order-track-${order.id}`)
        .on('postgres_changes', { 
          event: 'UPDATE', 
          schema: 'public', 
          table: 'orders', 
          filter: `id=eq.${order.id}` 
        }, payload => {
          updateUI(payload.new);
        })
        .subscribe();
    }

    function updateUI(order) {
      document.getElementById("cust-name").innerText = order.customer_name;
      document.getElementById("cust-address").innerText = order.table_number;
      document.getElementById("cust-total").innerText = order.total_amount.toFixed(2) + " TL";

      if (order.status === 'completed') {
        document.getElementById("order-status-text").innerText = "✓ Sipariş Teslim Edildi";
        document.getElementById("order-status-text").className = "text-xs text-green-600 font-semibold";
        document.getElementById("no-location-overlay").classList.remove("hidden");
        document.getElementById("no-location-overlay").innerHTML = '<div class="text-white font-bold">Bu sipariş başarıyla teslim edilmiştir.</div>';
        return;
      }

      if (order.courier_lat && order.courier_lng) {
        document.getElementById("no-location-overlay").classList.add("hidden");
        document.getElementById("order-status-text").innerText = "🛵 Kuryeniz yolda, canlı takip ediliyor";
        
        const courierPos = [order.courier_lat, order.courier_lng];

        if (!courierMarker) {
          const courierIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/2972/2972531.png',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
          });
          courierMarker = L.marker(courierPos, { icon: courierIcon }).addTo(map);
          map.setView(courierPos, 15);
        } else {
          courierMarker.setLatLng(courierPos);
          map.panTo(courierPos);
        }
      }
    }
  </script>
</body>
</html>
