<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kurye Saha Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen p-4 pb-20">

  <header class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
    <div>
      <h1 class="font-bold text-lg text-amber-400">Kurye Saha Paneli</h1>
      <p id="gps-status" class="text-xs text-slate-400 flex items-center gap-1.5 mt-1">
        <span id="gps-dot" class="w-2 h-2 bg-red-500 rounded-full inline-block"></span> GPS Bekleniyor
      </p>
    </div>
    <span class="bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-lg border border-slate-700">Canlı Takip Aktif</span>
  </header>

  <main class="space-y-4">
    <h2 class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Hazır Bekleyen & Taşımdaki Paketler</h2>
    <div id="orders-list" class="space-y-4">
      <p class="text-center text-slate-500 text-sm py-8">Bekleyen paket bulunmuyor.</p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://cctskakrpyxygxkujefu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjdHNrYWtycHl4eWd4a3VqZWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzQyNTQsImV4cCI6MjEwNjk1MDI1NH0.YkBuSrkPq6ts7UTx5F6DdAdh-ZGMk0rQenDgYzuDyPo";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeCarryingOrders = new Set(); 
    let gpsInterval = null;

    window.addEventListener("DOMContentLoaded", () => {
      loadCourierOrders();
      setInterval(loadCourierOrders, 6000);
      startRobustGPS();
    });

    function startRobustGPS() {
      if (!navigator.geolocation) return;
      fetchAndSendLocation();
      gpsInterval = setInterval(() => { fetchAndSendLocation(); }, 6000);
    }

    function fetchAndSendLocation() {
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;
          document.getElementById("gps-dot").className = "w-2 h-2 bg-emerald-500 rounded-full inline-block animate-ping";
          document.getElementById("gps-status").innerText = `GPS Aktif: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;

          if (activeCarryingOrders.size > 0) {
            for (const orderId of activeCarryingOrders) {
              await supabaseClient
                .from("orders")
                .update({ courier_lat: latitude, courier_lng: longitude })
                .eq("id", orderId);
            }
          }
        },
        (err) => {
          document.getElementById("gps-status").innerText = `GPS Sinyali Bekleniyor`;
          document.getElementById("gps-dot").className = "w-2 h-2 bg-amber-500 rounded-full inline-block";
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }

    async function loadCourierOrders() {
      // Sadece Mutfak Onaylı (waiting_for_courier) veya Kuryenin Yolda Olduğu (delivering) paketleri çek
      const { data: orders, error } = await supabaseClient
        .from("orders")
        .select("*, restaurants(name, phone, address)")
        .in("status", ["waiting_for_courier", "delivering"])
        .order("created_at", { ascending: false });

      if (error) return;
      renderOrders(orders);
    }

    function renderOrders(orders) {
      const container = document.getElementById("orders-list");
      container.innerHTML = "";

      if (orders.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 text-sm py-8">Bekleyen veya taşınan paket yok.</p>';
        return;
      }

      orders.forEach(order => {
        const isDelivering = order.status === 'delivering';
        if (isDelivering) {
          activeCarryingOrders.add(order.id);
        }

        const restaurantName = order.restaurants ? order.restaurants.name : "Restoran";
        const restaurantAddress = order.restaurants && order.restaurants.address ? order.restaurants.address : "Restoran Adresi";
        const customerNavUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.table_number)}`;

        let itemsListHtml = '';
        if (order.items && Array.isArray(order.items)) {
          itemsListHtml = order.items.map(i => `${i.name} (x${i.qty})`).join(', ');
        }

        const card = document.createElement("div");
        card.className = `bg-slate-800 p-4 rounded-xl border ${isDelivering ? 'border-blue-500 bg-slate-800/90' : 'border-slate-700'} space-y-3`;
        card.innerHTML = `
          <div class="flex justify-between items-start border-b border-slate-700/60 pb-2">
            <div>
              <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-bold uppercase">${restaurantName}</span>
              <h3 class="font-bold text-white text-base mt-1">${order.customer_name}</h3>
              <p class="text-xs text-slate-400">Tel: ${order.customer_phone || 'Yok'}</p>
            </div>
            <span class="text-xs font-bold bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-full border border-amber-500/20">${(order.total_amount || 0).toFixed(2)} TL</span>
          </div>

          <div class="bg-slate-900/60 p-3 rounded-lg text-xs space-y-2">
            <p class="text-slate-300"><span class="font-bold text-amber-400">Paket:</span> ${itemsListHtml || 'Ürün detayı yok'}</p>
            ${order.notes ? `<p class="text-amber-300 bg-amber-950/40 p-1.5 rounded border border-amber-800/50"><strong>Not:</strong> ${order.notes}</p>` : ''}
            <div class="pt-1">
              <p class="text-slate-400 font-medium">Teslimat Adresi:</p>
              <p class="text-slate-200 font-semibold mb-1.5">${order.table_number}</p>
              <a href="${customerNavUrl}" target="_blank" class="inline-flex items-center gap-1.5 text-blue-400 hover:text-blue-300 font-bold underline text-xs">
                🗺️ Google Haritalar'da Rota Aç
              </a>
            </div>
          </div>

          <div class="flex gap-2 pt-1">
            ${!isDelivering ? `
              <button onclick="startDelivery('${order.id}')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3 rounded-xl shadow transition text-xs flex items-center justify-center gap-1">
                🚀 Paketi Aldım / Yola Çık
              </button>
            ` : `
              <button onclick="finishDelivery('${order.id}')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 rounded-xl shadow transition text-xs">
                ✓ Teslim Et (Tamamla)
              </button>
            `}
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function startDelivery(orderId) {
      activeCarryingOrders.add(orderId);
      const { error } = await supabaseClient
        .from("orders")
        .update({ status: 'delivering' })
        .eq("id", orderId);

      if (error) {
        alert("Hata: " + error.message);
        return;
      }
      loadCourierOrders();
    }

    async function finishDelivery(orderId) {
      activeCarryingOrders.delete(orderId);
      await supabaseClient
        .from("orders")
        .update({ status: 'completed' })
        .eq("id", orderId);

      alert("Sipariş teslim edildi!");
      loadCourierOrders();
    }
  </script>
</body>
</html>
