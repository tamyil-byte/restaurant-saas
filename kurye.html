<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kurye Saha Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen p-4 pb-20">

  <header class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
    <div>
      <h1 class="font-bold text-lg text-amber-400">Kurye Saha Paneli</h1>
      <p id="gps-status" class="text-xs text-slate-400 flex items-center gap-1.5 mt-1">
        <span id="gps-dot" class="w-2 h-2 bg-red-500 rounded-full inline-block"></span> GPS Bekleniyor
      </p>
    </div>
    <span class="bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-lg border border-slate-700">İki Adımlı Rota</span>
  </header>

  <main class="space-y-4">
    <h2 class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Aktif Paketler & Rotalar</h2>
    <div id="orders-list" class="space-y-4">
      <p class="text-center text-slate-500 text-sm py-8">Yolda olan sipariş bulunmuyor.</p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://cctskakrpyxygxkujefu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjdHNrYWtycHl4eWd4a3VqZWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzQyNTQsImV4cCI6MjEwNjk1MDI1NH0.YkBuSrkPq6ts7UTx5F6DdAdh-ZGMk0rQenDgYzuDyPo";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeOrders = new Set();
    let watchId = null;

    window.addEventListener("DOMContentLoaded", () => {
      loadCourierOrders();
      setInterval(loadCourierOrders, 8000);
      startGPSWatcher();
    });

    function startGPSWatcher() {
      if (!navigator.geolocation) return;

      watchId = navigator.geolocation.watchPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;
          document.getElementById("gps-dot").className = "w-2 h-2 bg-emerald-500 rounded-full inline-block animate-ping";
          document.getElementById("gps-status").innerText = "GPS Konumu Aktif";

          if (activeOrders.size > 0) {
            for (const orderId of activeOrders) {
              await supabaseClient
                .from("orders")
                .update({ courier_lat: latitude, courier_lng: longitude })
                .eq("id", orderId);
            }
          }
        },
        (err) => console.log("GPS Hatası:", err),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );
    }

    async function loadCourierOrders() {
      // Restoran adını ve adresini de JOIN ile çekiyoruz
      const { data: orders, error } = await supabaseClient
        .from("orders")
        .select("*, restaurants(name, phone, address)")
        .in("status", ["preparing"])
        .order("created_at", { ascending: false });

      if (error) return;
      renderOrders(orders);
    }

    function renderOrders(orders) {
      const container = document.getElementById("orders-list");
      container.innerHTML = "";

      if (orders.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 text-sm py-8">Aktif paket bulunmuyor.</p>';
        return;
      }

      orders.forEach(order => {
        const isCarrying = activeOrders.has(order.id);
        const restaurantName = order.restaurants ? order.restaurants.name : "Restoran";
        const restaurantAddress = order.restaurants && order.restaurants.address ? order.restaurants.address : restaurantName;
        
        // Harita Linkleri
        const restNavUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(restaurantAddress)}`;
        const customerNavUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.table_number)}`;

        const card = document.createElement("div");
        card.className = `bg-slate-800 p-4 rounded-xl border ${isCarrying ? 'border-amber-500 bg-slate-800/90' : 'border-slate-700'} space-y-3`;
        card.innerHTML = `
          <div class="flex justify-between items-start border-b border-slate-700/60 pb-2">
            <div>
              <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-bold uppercase">Restoran: ${restaurantName}</span>
              <h3 class="font-bold text-white text-base mt-1">${order.customer_name}</h3>
              <p class="text-xs text-slate-400">Tel: ${order.customer_phone}</p>
            </div>
            <span class="text-xs font-bold bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-full border border-amber-500/20">${order.total_amount.toFixed(2)} TL</span>
          </div>

          <div class="bg-slate-900/60 p-3 rounded-lg text-xs space-y-2.5">
            <!-- 1. Adım: Restoran Rota Butonu -->
            <div class="border-b border-slate-800 pb-2">
              <p class="text-slate-400 font-medium">1. Adım - Paketi Alınacak Yer:</p>
              <p class="text-amber-400 font-semibold mb-1">${restaurantAddress}</p>
              <a href="${restNavUrl}" target="_blank" class="inline-flex items-center gap-1.5 text-amber-300 hover:text-amber-200 font-bold underline text-xs">
                📍 Restoran Adresine Yol Tarifi Aç
              </a>
            </div>

            <!-- 2. Adım: Müşteri Rota Butonu -->
            <div>
              <p class="text-slate-400 font-medium">2. Adım - Teslimat Adresi:</p>
              <p class="text-slate-200 font-semibold mb-1">${order.table_number}</p>
              <a href="${customerNavUrl}" target="_blank" class="inline-flex items-center gap-1.5 text-blue-400 hover:text-blue-300 font-bold underline text-xs">
                🗺️ Müşteri Adresine Yol Tarifi Aç
              </a>
            </div>

            ${order.customer_note ? `<p class="text-amber-300 italic pt-1 border-t border-slate-800 mt-1">Not: ${order.customer_note}</p>` : ''}
          </div>

          <div class="flex gap-2 pt-2">
            ${!isCarrying ? `
              <button onclick="toggleCarry('${order.id}', true)" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-xl shadow transition text-xs flex items-center justify-center gap-1">
                🚀 Paketi Aldım / Yola Çık
              </button>
            ` : `
              <button onclick="toggleCarry('${order.id}', false)" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl shadow transition text-xs">
                Listeden Çıkar
              </button>
              <button onclick="finishDelivery('${order.id}')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow transition text-xs">
                ✓ Teslim Et
              </button>
            `}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleCarry(orderId, status) {
      if (status) {
        activeOrders.add(orderId);
      } else {
        activeOrders.delete(orderId);
      }
      loadCourierOrders();
    }

    async function finishDelivery(orderId) {
      activeOrders.delete(orderId);

      await supabaseClient
        .from("orders")
        .update({ status: 'completed' })
        .eq("id", orderId);

      alert("Sipariş başarıyla teslim edildi!");
      loadCourierOrders();
    }
  </script>
</body>
</html>
